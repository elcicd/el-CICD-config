rbacGroups:
  default: devs
  QA: testers
  STG: testers
  PROD: cluster-admins
gitHost: github.com
gitRestApiHost: api.github.com
gitOrganization: elcicd
gitBranch: development
gitTestBranch: development
artifacts:
- gitRepoName: test-cicd-stationdemo-lib
  codeBase: java-maven
  status: ACTIVE
- gitRepoName: Test-CICD1-lib
  codeBase: python
  tester: pytest
  status: ACTIVE
components:
- gitRepoName: test-cicd-stationdemo
  codeBase: java-maven
  status: ACTIVE
  tests:
    QA:
    - name: test-cicd-int-tests
      enabled: true
    STG:
    - name: test-cicd-int-tests
      enabled: true
- gitRepoName: Test-CICD1
  codeBase: python
  tester: pytest
  status: ACTIVE
  staticPvs:
  - eng-nfs-dir
  - prod-nfs-dir
- gitRepoName: test_CICD2
  codeBase: python
  tester: pytest
  status: INACTIVE
- gitRepoName: TeSt-CiCd3
  codeBase: python
  tester: pytest
  status: ACTIVE
- gitRepoName: Test_CICD4
  codeBase: python
  tester: pytest
  status: ACTIVE
elCicdDefaults:
  annotations:
    test.cicd.io/proof-project-defaults-work: 'yup'
testComponents:
- gitRepoName: test-cicd-int-tests
  codeBase: cucumber
releaseProfiles:
- preprod
- east
- west
enabledTestEnvs:
- QA
sandboxEnvs: 2
allowsHotfixes: true
resourceQuotas:
  default:
  - SMALL_MEM_QUOTA
  - SMALL_MEM_LIMIT
  - SMALL_STORAGE_QUOTA
  DEV:
  - MEDIUM_MEM_QUOTA
  - MEDIUM_MEM_LIMIT
  - SMALL_STORAGE_QUOTA
  QA:
  - MEDIUM_MEM_QUOTA
  - MEDIUM_MEM_LIMIT
  - MEDIUM_STORAGE_QUOTA
  STG:
  - LARGE_MEM_QUOTA
  - LARGE_MEM_LIMIT
  - MEDIUM_STORAGE_QUOTA
  PROD:
  - LARGE_MEM_QUOTA
  - LARGE_MEM_LIMIT
  - LARGE_STORAGE_QUOTA
staticPvs:
- name: eng-nfs-dir
  envs:
  - QA
  - STG
  capacity: 5Gi
  accessMode: ReadWriteMany
  volumeType: nfs
  volumeDef:
    path: /mnt/demo-image-registry
    server: hippys-bfs.localdomain
- name: prod-nfs-dir
  envs:
  - PROD
  capacity: 15Gi
  accessMode: ReadWriteMany
  volumeType: nfs
  volumeDef:
    path: /mnt/demo-image-registry
    server: hippys-bfs.localdomain