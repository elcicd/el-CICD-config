- templateName: resourceQuota
  objName: medium-storage-quota
  mustHaveAnyProfile:
  - MEDIUM_STORAGE_QUOTA
  namespaces: $<medium-storage-quota_NAMESPACES>
  hard:
    requests.storage: 256Gi

- templateName: resourceQuota
  objName: large-mem-quota
  mustHaveAnyProfile:
  - LARGE_MEM_QUOTA
  namespaces: $<large-mem-quota_NAMESPACES>
  hard:
    limits.memory: 96Gi
  scopes:
  - NotTerminating

